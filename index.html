<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buzzer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1c1f2e;--mu:#6b7186;--pri:#5b3df5;--ok:#16a34a;--no:#dc2626;--bd:#e3e5f0}
@media(prefers-color-scheme:dark){:root{--bg:#12131c;--card:#1c1e2c;--tx:#eef0fa;--mu:#9a9fb8;--bd:#2c2f44}}
*{box-sizing:border-box}body{margin:0;font:17px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:720px;margin:auto;padding:16px}[hidden]{display:none!important}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:0 0 14px}
h1,h2{margin:0 0 8px}.muted{color:var(--mu);font-size:14px}
.logo{font-weight:800;font-size:26px;color:var(--pri)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.hud{display:flex;gap:8px;align-items:center;font-weight:700}.pill{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:4px 12px}
#live{width:10px;height:10px;border-radius:50%;background:#aaa;display:inline-block}#live.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tab,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.tab.on,.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}.opt.good{border-color:var(--ok);background:rgba(22,163,74,.15)}.opt.bad{border-color:var(--no);background:rgba(220,38,38,.15)}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--pri)}
.tag{background:var(--pri);color:#fff;border-radius:8px;padding:2px 10px;font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row.me{background:rgba(91,61,245,.1);border-radius:10px;padding:10px}.grow{flex:1}.av{font-size:28px}.rank{width:30px;font-weight:800;text-align:center}
.week{display:flex;gap:6px}.day{flex:1;text-align:center;border-radius:10px;padding:6px 0;background:var(--bd);font-size:13px}.day.on{background:var(--pri);color:#fff}
.alert{border-left:5px solid var(--no)}.reminder{border-left:5px solid #f59e0b}
input,select,textarea{width:100%;padding:10px;margin:4px 0 10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--bd)}
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.pcard{cursor:pointer;text-align:center}.pcard:hover{border-color:var(--pri)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--pri);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;max-width:90%}
</style></head><body><div class="wrap">
<section id="login"><div class="top"><span class="logo">⚡ Buzzer</span></div>
<div class="card"><h2>Welcome 👋</h2><p class="muted">Sign in to start training.</p>
<input id="un" placeholder="Username" autocapitalize="none" autocomplete="username">
<input id="pw" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')signIn()">
<button class="btn pri" onclick="signIn()">Sign in</button><p id="msg" class="muted"></p></div></section>
<section id="app" hidden>
<div class="top"><span class="logo">⚡ Buzzer</span><div class="hud"><span id="live" title="Live"></span><span class="pill" id="hs"></span><span class="pill" id="hp"></span><button class="tab" onclick="out()">Sign out</button></div></div>
<div class="tabs" id="tabs"></div><div id="view"></div></section></div><div id="toast" hidden></div>
<script>
// ====== PASTE YOUR SUPABASE VALUES HERE (Supabase > Connect button) ======
const SUPABASE_URL="https://zaljvkuapjvyldgqxcbo.supabase.co";
const SUPABASE_KEY="sb_publishable_c23eYj6vkOJotmmKWMZZ9w_2TdTeT1V";
// =========================================================================
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let sb,tok,me,qs=[],done=new Set(),bought=new Set(),days=new Set(),board=[],alerts=[],rewards=[],tab='learn';
const msg=t=>$('#msg').textContent=t,ago=t=>{const m=Math.round((Date.now()-new Date(t))/6e4);return m<1?'just now':m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'};
const rpc=(f,a={})=>sb.rpc(f,{t:tok,...a}).then(r=>{if(r.error){toast(r.error.message);return null}return r.data});
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,4000)}
function boot(){
 if(!SUPABASE_URL||!SUPABASE_KEY)return msg('Setup needed: open index.html and paste your Supabase URL and key at the top of the script.');
 sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 try{tok=localStorage.getItem('buzzer_tok')}catch(e){}if(tok)enter()}
async function signIn(){const{data,error}=await sb.rpc('app_login',{u:$('#un').value,p:$('#pw').value});if(error)return msg(error.message);
 tok=data;try{localStorage.setItem('buzzer_tok',tok)}catch(e){}enter()}
function out(){try{localStorage.removeItem('buzzer_tok')}catch(e){}location.reload()}
async function enter(){
 const s=await rpc('app_state');if(!s){tok=null;try{localStorage.removeItem('buzzer_tok')}catch(e){}return}
 me=s.me;done=new Set(s.done);bought=new Set(s.bought);days=new Set(s.days);qs=await rpc('get_questions')||[];
 const[r,a]=await Promise.all([sb.from('rewards').select('*').eq('active',true).order('cost'),sb.from('alerts').select('*').order('created_at',{ascending:false})]);
 rewards=r.data||[];alerts=a.data||[];await loadBoard();
 $('#login').hidden=true;$('#app').hidden=false;hud();tabsUI();show('learn');
 sb.channel('buzzer')
  .on('postgres_changes',{event:'*',schema:'public',table:'scores'},loadBoard)
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'alerts'},p=>{toast('🔔 '+p.new.title);loadAlerts()})
  .on('postgres_changes',{event:'DELETE',schema:'public',table:'alerts'},loadAlerts)
  .subscribe(s=>$('#live').className=s==='SUBSCRIBED'?'on':'')}
async function loadBoard(){const{data}=await sb.from('scores').select('*').order('points',{ascending:false}).order('streak',{ascending:false});board=data||[];
 const m=board.find(p=>p.user_id===me.user_id);if(m){me=m;hud()}if(tab!=='learn')show(tab)}
async function loadAlerts(){const{data}=await sb.from('alerts').select('*').order('created_at',{ascending:false});alerts=data||[];tabsUI();if(tab==='alerts')show(tab)}
function hud(){$('#hs').textContent='🔥 '+me.streak;$('#hp').textContent='⭐ '+(me.points-me.spent)}
function tabsUI(){const t=[['learn','Training'],['board','Leaderboard'],['market','Marketplace'],['alerts','Alerts'+(alerts.length?' ('+alerts.length+')':'')]];if(me.role==='admin')t.push(['admin','Admin']);
 $('#tabs').innerHTML=t.map(([k,l])=>`<button class="tab ${k===tab?'on':''}" onclick="show('${k}')">${l}</button>`).join('')}
function show(t){tab=t;tabsUI();$('#view').innerHTML={learn,board:lb,market,alerts:al,admin}[t]()}
function learn(){const q=qs.find(x=>!done.has(x.id));
 const wk=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5);return{l:d.toLocaleDateString([],{weekday:'narrow'}),on:days.has(d.toISOString().slice(0,10))||i===6}});
 let h=`<div class="card"><b>Your streak: 🔥 ${me.streak} day${me.streak==1?'':'s'}</b> <span class="muted">(best ${me.best_streak})</span><div class="week" style="margin-top:10px">${wk.map(d=>`<div class="day ${d.on?'on':''}">${d.l}<br>${d.on?'✓':'·'}</div>`).join('')}</div></div>
 <div class="card"><div class="muted">${done.size} of ${qs.length} answered</div><div class="bar"><i style="width:${qs.length?done.size/qs.length*100:0}%"></i></div></div>`;
 if(!q)return h+'<div class="card"><h2>🎉 All done!</h2><p>You finished every question. Visit the Marketplace to spend your stars, and come back tomorrow to keep your streak.</p></div>';
 return h+`<div class="card"><span class="tag">${esc(q.category)}</span> <span class="muted">+${q.points} stars</span><h2 style="margin-top:10px">${esc(q.question)}</h2>${q.options.map((o,i)=>`<button class="opt" onclick="answer(${q.id},${i})">${esc(o)}</button>`).join('')}<div id="fb"></div></div>`}
async function answer(id,i){const r=await rpc('submit_answer',{q:id,c:i});if(!r)return;
 document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===r.answer)b.classList.add('good');else if(j===i)b.classList.add('bad')});
 done.add(id);$('#fb').innerHTML=`<p><b>${r.correct?'✅ Correct! +'+r.points+' stars':'❌ Not quite. The right answer is green.'}</b></p><button class="btn pri" onclick="show('learn')">${qs.length-done.size?'Next question →':'Finish'}</button>`}
function lb(){return`<div class="card"><h2>🏆 Live Leaderboard</h2><p class="muted">Updates instantly as people answer.</p>${board.map((p,i)=>`<div class="row ${p.user_id===me.user_id?'me':''}"><span class="rank">${['🥇','🥈','🥉'][i]||i+1}</span><span class="av">${esc(p.avatar)}</span><span class="grow"><b>${esc(p.name)}</b><br><span class="muted">🔥 ${p.streak}-day streak</span></span><b>${p.points} ⭐</b></div>`).join('')}</div>`}
function market(){const bal=me.points-me.spent;
 return`<div class="card"><h2>🛍️ Marketplace</h2><p>You have <b>⭐ ${bal}</b> to spend. <span class="muted">Earn more in Training.</span></p></div>`+rewards.map(r=>`<div class="card row"><span class="av">${esc(r.icon)}</span><span class="grow"><b>${esc(r.name)}</b><br><span class="muted">${esc(r.info)}</span></span>${bought.has(r.id)?'<b>✅ Got it</b>':`<button class="btn ${bal>=r.cost?'pri':''}" ${bal<r.cost?'disabled':''} onclick="buy(${r.id})">⭐ ${r.cost}</button>`}</div>`).join('')}
async function buy(id){if(await rpc('buy',{rid:id})){bought.add(id);toast('🎉 Enjoy your reward!');await loadBoard();show('market')}}
function al(){const n=qs.length-done.size;
 return(n?`<div class="card reminder"><b>⏰ Reminder</b><br>You have ${n} question${n==1?'':'s'} waiting. Keep your 🔥 ${me.streak}-day streak going!</div>`:'')+
 (alerts.map(a=>`<div class="card ${a.kind}"><span class="tag">${a.kind==='alert'?'🚨 Alert':'⏰ Reminder'}</span> <span class="muted">${ago(a.created_at)}</span><h2 style="margin-top:8px">${esc(a.title)}</h2>${esc(a.body)}</div>`).join('')||'<div class="card muted">No alerts yet.</div>')}
function admin(){return`<div class="card"><h2>Send an alert or reminder</h2><select id="ak"><option value="alert">🚨 Alert</option><option value="reminder">⏰ Reminder</option></select><input id="at" placeholder="Title"><textarea id="ab" rows="2" placeholder="Message"></textarea><button class="btn pri" onclick="post()">Send to everyone</button></div>
<div class="card"><h2>Team</h2><table><tr><th>Name</th><th>Role</th><th>⭐</th><th>🔥</th><th>Last login</th></tr>${board.map(p=>`<tr><td>${esc(p.avatar)} ${esc(p.name)}</td><td>${p.role}</td><td>${p.points}</td><td>${p.streak}</td><td>${p.last_login||'-'}</td></tr>`).join('')}</table>
<p class="muted">To add people, change passwords, questions or rewards: open Supabase, then Table Editor.</p></div>
<div class="card"><h2>Manage</h2>${alerts.map(a=>`<div class="row"><span class="grow">${esc(a.title)}</span><button class="btn" onclick="delA(${a.id})">Delete</button></div>`).join('')}<p><button class="btn" onclick="resetR()">Reset all results and stars</button></p></div>`}
async function post(){const t=$('#at').value.trim();if(!t)return toast('Add a title');if(await rpc('post_alert',{k:$('#ak').value,ti:t,b:$('#ab').value}))show('admin')}
async function delA(id){await rpc('delete_alert',{x:id})}
async function resetR(){if(!confirm('Reset everyone: results, stars and rewards?'))return;if(await rpc('reset_all')){done=new Set();bought=new Set();toast('All reset')}}
boot();
</script></body></html>
